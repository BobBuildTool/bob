[package]
name = "bob-dirhasher"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = "0.29.3"
sha1 = "0.11.0"
tempfile = "3"
threadpool = "1.8.1"

[profile.release-lto]
inherits = "release"
lto = true

[lib]
# See https://github.com/PyO3/pyo3 for details
name = "_dirhasher"  # private module to be nested into Python package
crate-type = ["cdylib"]
path = "src/lib.rs"
